/* ══════════════════════════════════════════════════════════════════
   CROSS-SECTION 模組 — 沿任意 A–A′ 線切剖面，並著色 composition 材料
   ══════════════════════════════════════════════════════════════════ */

const DEG = Math.PI/180, R_EARTH = 6371000;

const COMP_PALETTE = [
  '#4f8ef7','#f76f6f','#3ecf8e','#f5c842','#c792ea','#ff9f43',
  '#2ee6d6','#ff7ab6','#a0d911','#8b9dc3','#e17055','#00b894',
  '#6c5ce7','#fdcb6e','#d63031','#0984e3','#badc58','#eb4d4b'
];
function compColor(id){
  const i = ((id % COMP_PALETTE.length) + COMP_PALETTE.length) % COMP_PALETTE.length;
  return COMP_PALETTE[i];
}

const SEC_LINE_COLOR = { A:'#f5c842', B:'#2ee6d6' };
function newSectionLine(id){
  return {
    id, on:(id==='A'), color:SEC_LINE_COLOR[id],
    p1:null, p2:null, preview:null,
    nx:0, nz:0, total:0, ms:0,
    fiGrid:null, compGrid:null, raster:null, plot:null, prep:null, frame:null,
    compsUsed:[], featsUsed:[], hover:null
  };
}
S.section = {
  open:false,
  picking:0,            // 0 = 無, 1 = 等起點, 2 = 等終點
  pickId:null,          // 'A' | 'B'
  dragEnd:null,         // { id, key }
  maxDepth:400000,      // m
  res:480,
  equalLen:false, eqRef:'A',
  hiddenComps:new Set(),
  timer:null,
  lines:{ A:newSectionLine('A'), B:newSectionLine('B') }
};
function secLines(){ return [S.section.lines.A, S.section.lines.B]; }
function secActiveLines(){ return secLines().filter(L=>L.on && L.p1 && L.p2); }

/* ── 座標系統 / 局部平面座標 ────────────────────────────── */
function coordIsSpherical(){
  const cs = S.editedData && S.editedData['coordinate system'];
  if(!cs) return false;
  const m = (typeof cs === 'string') ? cs : cs.model;
  return typeof m === 'string' && m.toLowerCase().includes('spherical');
}
let SEC_ORIGIN = {x:0,y:0}, SEC_SPH = false, SEC_COSLAT = 1;
function setLocalFrame(o){
  SEC_ORIGIN = {x:o.x, y:o.y};
  SEC_SPH = coordIsSpherical();
  SEC_COSLAT = SEC_SPH ? Math.max(0.02, Math.cos(o.y*DEG)) : 1;
  return { o:SEC_ORIGIN, sph:SEC_SPH, cos:SEC_COSLAT };
}
// 每條剖面線的 prep 是在自己的局部座標框下建的，查詢前必須切回同一個框
function useFrame(fr){
  if(!fr) return;
  SEC_ORIGIN = fr.o; SEC_SPH = fr.sph; SEC_COSLAT = fr.cos;
}
function toLocal(p){
  const x = Array.isArray(p) ? p[0] : p.x;
  const y = Array.isArray(p) ? p[1] : p.y;
  if(SEC_SPH) return { x:(x-SEC_ORIGIN.x)*DEG*R_EARTH*SEC_COSLAT, y:(y-SEC_ORIGIN.y)*DEG*R_EARTH };
  return { x:x-SEC_ORIGIN.x, y:y-SEC_ORIGIN.y };
}
function worldDist(a,b){
  if(coordIsSpherical()){
    const f1=a.y*DEG, f2=b.y*DEG, df=(b.y-a.y)*DEG, dl=(b.x-a.x)*DEG;
    const h=Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
    return 2*R_EARTH*Math.asin(Math.min(1,Math.sqrt(h)));
  }
  return Math.hypot(b.x-a.x, b.y-a.y);
}

/* ── 小工具 ─────────────────────────────────────────────── */
function num(v, dflt){
  if(typeof v === 'number') return v;
  if(Array.isArray(v) && typeof v[0] === 'number') return v[0];
  return dflt;
}
function pair(v, dflt){
  if(typeof v === 'number') return [v,v];
  if(Array.isArray(v)){
    const a = v.filter(x=>typeof x==='number');
    if(a.length>=2) return [a[0],a[1]];
    if(a.length===1) return [a[0],a[0]];
  }
  return dflt;
}
function pointInPoly(pt, poly){
  let inside=false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const pi=poly[i], pj=poly[j];
    if(!Array.isArray(pi)||!Array.isArray(pj)) continue;
    const xi=pi[0], yi=pi[1], xj=pj[0], yj=pj[1];
    if(((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/((yj-yi)||1e-30)+xi)) inside=!inside;
  }
  return inside;
}
// GWB 的「一個值 或 一串 [值, 區域多邊形]」語法
function surfaceValue(spec, pt, dflt){
  if(spec==null) return dflt;
  if(typeof spec === 'number') return spec;
  if(!Array.isArray(spec)) return dflt;
  let global=dflt, hasGlobal=false, areaVal=null;
  for(const item of spec){
    if(typeof item === 'number'){ if(!hasGlobal){ global=item; hasGlobal=true; } continue; }
    if(!Array.isArray(item)) continue;
    const v = (typeof item[0]==='number') ? item[0] : null;
    if(v===null) continue;
    const area = item[1];
    if(Array.isArray(area) && area.length && Array.isArray(area[0])){
      if(pointInPoly(pt, area)) areaVal = v;      // 後面的區域覆蓋前面的
    } else if(!hasGlobal){ global=v; hasGlobal=true; }
  }
  return areaVal!==null ? areaVal : global;
}
function pickComp(mod){
  const comps = mod.compositions;
  if(!Array.isArray(comps) || !comps.length) return null;
  const fr = Array.isArray(mod.fractions) ? mod.fractions : [];
  let bi=0, bf = fr.length ? (fr[0]!==undefined?fr[0]:1) : 1;
  for(let i=1;i<comps.length;i++){
    const v = (fr[i]!==undefined) ? fr[i] : (fr.length?0:1);
    if(v>bf){ bf=v; bi=i; }
  }
  return { comp:comps[bi], frac:bf, comps, fracs:fr };
}
function compFromModels(models, test){
  if(!Array.isArray(models)) return null;
  let res=null;
  for(const mod of models){
    if(!mod || typeof mod!=='object') continue;
    if(!test(mod)) continue;
    const op = mod.operation || 'replace';
    if(op === 'subtract'){ res=null; continue; }
    const p = pickComp(mod);
    if(!p) continue;
    res = Object.assign({ modelName: mod.model || 'uniform' }, p);
  }
  return res;
}

/* ── feature 幾何 ───────────────────────────────────────── */
function featureKind(f){
  const m = String(f.model||'').toLowerCase();
  if(m.includes('subducting')) return 'slab';
  if(m.includes('fault'))      return 'fault';
  return 'area';
}

// 由 segments 建出 slab / fault 的中心（或頂）曲線，座標系 (h = 離 trench 沿 dip 方向, v = 深度)
function buildSlabGeom(f){
  const segs = Array.isArray(f.segments) ? f.segments : [];
  const pts=[{h:0,v:0,s:0}], bounds=[];
  let s=0;
  segs.forEach(seg=>{
    if(!seg || typeof seg!=='object') return;
    const L = num(seg.length, 0);
    if(!(L>0)) return;
    const ang = pair(seg.angle, [0,0]);
    const th  = pair(seg.thickness, [0,0]);
    const tt  = pair(seg['top truncation'], [0,0]);
    const n = Math.max(4, Math.min(120, Math.ceil(Math.abs(ang[1]-ang[0])/1.5)+4));
    let last = pts[pts.length-1], h=last.h, v=last.v;
    for(let k=1;k<=n;k++){
      const tm=(k-0.5)/n;
      const a=(ang[0]+(ang[1]-ang[0])*tm)*DEG, ds=L/n;
      h += Math.cos(a)*ds;
      v += Math.sin(a)*ds;
      pts.push({h, v, s: s + L*k/n});
    }
    bounds.push({ s0:s, s1:s+L, th, tt, seg });
    s += L;
  });
  return { pts, bounds, total:s };
}
// 投影到 trench 線（局部平面座標），回傳沿 dip 方向的帶號距離
function projectLine(line, q, dip){
  if(!Array.isArray(line) || line.length<2) return {ok:false};
  let best=null;
  for(let i=0;i<line.length-1;i++){
    const a=line[i], b=line[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
    if(L2===0) continue;
    let t=((q.x-a.x)*dx+(q.y-a.y)*dy)/L2;
    const outside = (i===0 && t<0) || (i===line.length-2 && t>1);
    t=Math.max(0,Math.min(1,t));
    const px=a.x+dx*t, py=a.y+dy*t;
    const d=Math.hypot(q.x-px, q.y-py);
    if(!best || d<best.d) best={d, px, py, dx, dy, outside};
  }
  if(!best) return {ok:false};
  let nx=-best.dy, ny=best.dx;
  const nl=Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
  if(dip){
    const sgn=(dip.x-best.px)*nx + (dip.y-best.py)*ny;
    if(sgn<0){ nx=-nx; ny=-ny; }
  }
  return { ok: !best.outside, hd: (q.x-best.px)*nx + (q.y-best.py)*ny };
}
// 查詢 (h, depth) 對 slab 頂面的垂直帶號距離；正 = 在頂面「下方」（板塊內部）
function slabAt(geom, hd, depth){
  const pts=geom.pts;
  if(pts.length<2) return null;
  let best=null;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const dx=b.h-a.h, dy=b.v-a.v, L2=dx*dx+dy*dy;
    if(L2===0) continue;
    let t=((hd-a.h)*dx+(depth-a.v)*dy)/L2;
    const outside = (i===0 && t<0) || (i===pts.length-2 && t>1);
    t=Math.max(0,Math.min(1,t));
    const ph=a.h+dx*t, pv=a.v+dy*t;
    const d=Math.hypot(hd-ph, depth-pv);
    if(!best || d<best.d){
      const cross = dx*(depth-a.v) - dy*(hd-a.h);   // >0 → 位於頂面法向側（板內）
      best={ d, s:a.s+(b.s-a.s)*t, side: cross>=0?1:-1, outside };
    }
  }
  if(!best || best.outside) return null;             // 超出 slab 頭尾 → 不屬於此 feature
  return { dz: best.d*best.side, s: best.s };
}
function segAt(geom, s){
  for(const b of geom.bounds){
    if(s>=b.s0 && s<=b.s1){
      const span=b.s1-b.s0;
      const fr = span>0 ? (s-b.s0)/span : 0;
      return { b, th: b.th[0]+(b.th[1]-b.th[0])*fr, tt: b.tt[0]+(b.tt[1]-b.tt[0])*fr };
    }
  }
  return null;
}

/* ── composition 判定 ───────────────────────────────────── */
function areaFeatureComp(f, pt, depth){
  return compFromModels(f['composition models'], mod=>{
    const mn=surfaceValue(mod['min depth'], pt, 0);
    const mx=surfaceValue(mod['max depth'], pt, Infinity);
    return depth>=mn && depth<=mx;
  });
}
function slabFeatureComp(f, sg, dz, depth, kind){
  const key = (kind==='fault') ? 'distance fault center' : 'distance slab top';
  const val = (kind==='fault') ? Math.abs(dz) : dz;
  const test = mod=>{
    const mn=num(mod['min '+key], -Infinity), mx=num(mod['max '+key], Infinity);
    if(val<mn || val>mx) return false;
    const dmn=num(mod['min depth'], -Infinity), dmx=num(mod['max depth'], Infinity);
    return depth>=dmn && depth<=dmx;
  };
  let r = compFromModels(f['composition models'], test);
  if(sg && sg.b && sg.b.seg){
    const r2 = compFromModels(sg.b.seg['composition models'], test);
    if(r2) r = r2;                                  // segment 層級覆蓋 feature 層級
  }
  return r;
}

/* ── 準備 & 計算 ────────────────────────────────────────── */
function prepareSection(){
  const feats = (S.editedData && Array.isArray(S.editedData.features)) ? S.editedData.features : [];
  return feats.map((f, fi)=>{
    const kind = featureKind(f);
    const o = { fi, f, kind, name: f.name || `F${fi}`, color: getColor(fi) };
    if(kind==='area'){
      o.poly = Array.isArray(f.coordinates) ? f.coordinates : [];
    } else {
      o.line = (Array.isArray(f.coordinates) ? f.coordinates : []).map(toLocal);
      o.dip  = Array.isArray(f['dip point']) ? toLocal(f['dip point']) : null;
      o.geom = buildSlabGeom(f);
    }
    return o;
  });
}

// 單點查詢（tooltip 用），t ∈ [0,1] 沿該剖面線，depth 為公尺
function sectionProbe(L, t, depth){
  if(!L || !L.prep || !L.p1 || !L.p2) return null;
  useFrame(L.frame);
  const pt = { x: L.p1.x+(L.p2.x-L.p1.x)*t, y: L.p1.y+(L.p2.y-L.p1.y)*t };
  const loc = toLocal(pt);
  let hit=null;
  for(const p of L.prep){
    if(S.hiddenFeatures.has(p.fi)) continue;
    if(p.kind==='area'){
      if(p.poly.length<3 || !pointInPoly(pt, p.poly)) continue;
      const fmn=surfaceValue(p.f['min depth'], pt, null), fmx=surfaceValue(p.f['max depth'], pt, null);
      if(fmn!=null && depth<fmn) continue;
      if(fmx!=null && depth>fmx) continue;
      const r=areaFeatureComp(p.f, pt, depth);
      if(!r && !(fmn!=null || fmx!=null)) continue;
      hit = { p, comp:r, extra:null };
    } else {
      const tr = projectLine(p.line, loc, p.dip);
      if(!tr.ok) continue;
      const sl = slabAt(p.geom, tr.hd, depth);
      if(!sl) continue;
      const sg = segAt(p.geom, sl.s);
      if(!sg) continue;
      const top = (p.kind==='fault') ? -sg.th/2 : Math.max(0, sg.tt);
      const bot = (p.kind==='fault') ?  sg.th/2 : sg.th;
      if(sl.dz<top || sl.dz>bot) continue;
      hit = { p, comp: slabFeatureComp(p.f, sg, sl.dz, depth, p.kind),
              extra: { dz: sl.dz, s: sl.s, th: sg.th } };
    }
  }
  return hit;
}

function computeOneLine(L){
  const sec=S.section;
  L.fiGrid=null; L.compGrid=null; L.raster=null; L.prep=null;
  L.compsUsed=[]; L.featsUsed=[];
  if(!S.editedData || !L.on || !L.p1 || !L.p2) return;

  const t0=performance.now();
  L.frame = setLocalFrame(L.p1);
  L.prep = prepareSection();
  L.total = worldDist(L.p1, L.p2);
  if(!(L.total>0)){ L.prep=null; return; }

  const plot = L.plot || {w:900, h:300};
  const nx = Math.max(60, Math.min(1400, sec.res|0));
  let nz = Math.round(nx * (plot.h / Math.max(1, plot.w)));
  nz = Math.max(60, Math.min(700, nz));
  L.nx=nx; L.nz=nz;

  const fiG = new Int16Array(nx*nz).fill(-1);
  const cG  = new Int16Array(nx*nz).fill(-1);
  const usedComp=new Set(), usedFeat=new Set();
  const prep=L.prep;

  for(let i=0;i<nx;i++){
    const t=(i+0.5)/nx;
    const pt={ x: L.p1.x+(L.p2.x-L.p1.x)*t, y: L.p1.y+(L.p2.y-L.p1.y)*t };
    const loc=toLocal(pt);
    // 每一「行」只需算一次的東西
    const col = prep.map(p=>{
      if(S.hiddenFeatures.has(p.fi)) return {skip:true};
      if(p.kind==='area'){
        if(p.poly.length<3) return {skip:true};
        if(!pointInPoly(pt, p.poly)) return {skip:true};
        return { inside:true,
                 fmn: surfaceValue(p.f['min depth'], pt, null),
                 fmx: surfaceValue(p.f['max depth'], pt, null) };
      }
      const tr = projectLine(p.line, loc, p.dip);
      return tr.ok ? { tr } : { skip:true };
    });

    for(let j=0;j<nz;j++){
      const depth=(j+0.5)/nz*sec.maxDepth;
      let hitFi=-1, hitComp=-1;
      for(let m=0;m<prep.length;m++){
        const c=col[m]; if(c.skip) continue;
        const p=prep[m];
        if(p.kind==='area'){
          if(c.fmn!=null && depth<c.fmn) continue;
          if(c.fmx!=null && depth>c.fmx) continue;
          const r=areaFeatureComp(p.f, pt, depth);
          // 沒有 composition model 命中、又沒有明確的 feature 深度範圍 → 不遮蔽下層 feature
          if(!r && !(c.fmn!=null || c.fmx!=null)) continue;
          hitFi=p.fi;
          hitComp = r ? r.comp : -1;
        } else {
          const sl=slabAt(p.geom, c.tr.hd, depth);
          if(!sl) continue;
          const sg=segAt(p.geom, sl.s);
          if(!sg) continue;
          const top=(p.kind==='fault') ? -sg.th/2 : Math.max(0, sg.tt);
          const bot=(p.kind==='fault') ?  sg.th/2 : sg.th;
          if(sl.dz<top || sl.dz>bot) continue;
          hitFi=p.fi;
          const r=slabFeatureComp(p.f, sg, sl.dz, depth, p.kind);
          hitComp = r ? r.comp : -1;
        }
      }
      const k=j*nx+i;
      fiG[k]=hitFi; cG[k]=hitComp;
      if(hitFi>=0) usedFeat.add(hitFi);
      if(hitComp>=0) usedComp.add(hitComp);
    }
  }

  L.fiGrid=fiG; L.compGrid=cG;
  L.compsUsed=[...usedComp].sort((a,b)=>a-b);
  L.featsUsed=[...usedFeat].sort((a,b)=>a-b);
  L.ms=Math.round(performance.now()-t0);
  paintLineRaster(L);
}

function computeSectionGrids(){
  const sec=S.section;
  sec.timer=null;
  if(!sec.open){ return; }
  secLines().forEach(computeOneLine);
  drawSectionCanvas();
  buildSectionLegend();
  updateSectionInfo();
}

function scheduleSectionCompute(delay){
  const sec=S.section;
  if(!sec.open) return;
  if(sec.timer) clearTimeout(sec.timer);
  sec.timer = setTimeout(computeSectionGrids, delay==null?160:delay);
}

/* ── 光柵著色 ───────────────────────────────────────────── */
function hexRgb(h){
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function hslRgb(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if(h<60)      [r,g,b]=[c,x,0];
  else if(h<120)[r,g,b]=[x,c,0];
  else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];
  else if(h<300)[r,g,b]=[x,0,c];
  else          [r,g,b]=[c,0,x];
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function paintLineRaster(L){
  if(!L.fiGrid){ L.raster=null; return; }
  const sec=S.section, nx=L.nx, nz=L.nz;
  const cv=document.createElement('canvas'); cv.width=nx; cv.height=nz;
  const g=cv.getContext('2d');
  const img=g.createImageData(nx,nz), D=img.data;
  const featCache={};
  for(let j=0;j<nz;j++){
    for(let i=0;i<nx;i++){
      const k=j*nx+i, o=k*4;
      const fi=L.fiGrid[k], comp=L.compGrid[k];
      let col=null;
      if(fi>=0){
        if(comp>=0 && !sec.hiddenComps.has(comp)) col=hexRgb(compColor(comp));
        else {
          if(!featCache[fi]) featCache[fi]=hslRgb((fi*137.508)%360, .30, .26);
          col=featCache[fi];                        // 有 feature 但沒 composition
        }
      }
      if(!col){ D[o+3]=0; continue; }
      const edge = (i>0 && (L.fiGrid[k-1]!==fi || L.compGrid[k-1]!==comp)) ||
                   (j>0 && (L.fiGrid[k-nx]!==fi || L.compGrid[k-nx]!==comp));
      const f = edge ? 0.34 : 1;
      D[o]=Math.round(col[0]*f); D[o+1]=Math.round(col[1]*f); D[o+2]=Math.round(col[2]*f); D[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  L.raster=cv;
}
function repaintAllRasters(){ secLines().forEach(L=>paintLineRaster(L)); }

/* ── 剖面畫布 ───────────────────────────────────────────── */
function niceStep(range, target){
  const raw=range/Math.max(1,target);
  const mag=Math.pow(10, Math.floor(Math.log10(raw||1)));
  const f=raw/mag;
  return mag*(f<1.5?1:f<3?2:f<7?5:10);
}
function resizeSectionCanvas(){
  const c=$('secCanvas'); if(!c) return;
  const body=c.parentElement;
  const w=body.clientWidth, h=body.clientHeight;
  if(w<1||h<1) return;
  if(c.width!==w || c.height!==h){ c.width=w; c.height=h; }
  drawSectionCanvas();
}
// 依開啟的剖面數量切出 1 或 2 個繪圖區
function layoutSectionPlots(W,H){
  const shown = secLines().filter(L=>L.on);
  const mT=22, mB=32, mL=62, mR=16;
  if(!shown.length) return [];
  if(shown.length===1){
    return [{ L:shown[0], x:mL, y:mT, w:W-mL-mR, h:H-mT-mB }];
  }
  const half=W/2;
  return shown.map((L,i)=>({ L, x:i*half+mL, y:mT, w:half-mL-mR, h:H-mT-mB }));
}
function drawSectionCanvas(){
  const c=$('secCanvas'); if(!c) return;
  const g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const sec=S.section;

  const rects=layoutSectionPlots(W,H);
  secLines().forEach(L=>{ L.plot=null; });
  if(!rects.length){
    g.fillStyle='#5a6480'; g.textAlign='center'; g.textBaseline='middle';
    g.font='13px "Microsoft JhengHei", sans-serif';
    g.fillText(t('sec.bothOff'), W/2, H/2);
    return;
  }
  let needRecompute=false;
  rects.forEach(r=>{
    const L=r.L;
    const prev=L.plotPrev;
    L.plot={x:r.x, y:r.y, w:r.w, h:r.h};
    if(prev && (Math.abs(prev.w-r.w)>24 || Math.abs(prev.h-r.h)>24)) needRecompute=true;
    L.plotPrev={w:r.w, h:r.h};
    drawOnePlot(g, L, r);
  });
  if(needRecompute) scheduleSectionCompute(220);
}
function drawOnePlot(g, L, r){
  const sec=S.section;
  const {x:mL, y:mT, w:pw, h:ph}=r;
  if(pw<40||ph<40) return;

  g.fillStyle='#0c0e16'; g.fillRect(mL,mT,pw,ph);

  // 標題
  g.font='bold 11.5px Consolas'; g.textBaseline='bottom'; g.textAlign='left';
  g.fillStyle=L.color;
  g.fillText(`${L.id}–${L.id}′`, mL, mT-5);

  if(!L.p1 || !L.p2){
    g.fillStyle='#5a6480'; g.textAlign='center'; g.textBaseline='middle';
    g.font='12.5px "Microsoft JhengHei", sans-serif';
    g.fillText(t('sec.hint').replace(/\{id\}/g, L.id), mL+pw/2, mT+ph/2);
    g.strokeStyle='#2a3045'; g.lineWidth=1; g.strokeRect(mL+.5, mT+.5, pw-1, ph-1);
    return;
  }
  if(L.raster){
    g.imageSmoothingEnabled=false;
    g.drawImage(L.raster, mL, mT, pw, ph);
  }

  // 座標軸
  const totKm=L.total/1000, depKm=sec.maxDepth/1000;
  const xStep=niceStep(totKm, Math.max(3, Math.round(pw/110)));
  const yStep=niceStep(depKm, Math.max(3, Math.round(ph/60)));
  g.strokeStyle='rgba(255,255,255,.09)'; g.lineWidth=1;
  g.fillStyle='#5a6480'; g.font='10px Consolas'; g.textBaseline='middle';

  g.textAlign='right';
  for(let d=0; d<=depKm+1e-9; d+=yStep){
    const y=mT+(d/depKm)*ph;
    if(y>mT+ph+.5) break;
    g.beginPath(); g.moveTo(mL,y+.5); g.lineTo(mL+pw,y+.5); g.stroke();
    g.fillText(`${(+d.toFixed(3)).toLocaleString()}`, mL-8, y);
  }
  g.save();
  g.translate(mL-46, mT+ph/2); g.rotate(-Math.PI/2);
  g.textAlign='center'; g.fillStyle='#5a6480'; g.font='10.5px Consolas';
  g.fillText('depth (km)', 0, 0);
  g.restore();

  g.textAlign='center'; g.textBaseline='top';
  for(let d=0; d<=totKm+1e-9; d+=xStep){
    const x=mL+(d/totKm)*pw;
    if(x>mL+pw+.5) break;
    g.beginPath(); g.moveTo(x+.5,mT); g.lineTo(x+.5,mT+ph); g.stroke();
    g.fillText(`${(+d.toFixed(3)).toLocaleString()}`, x, mT+ph+6);
  }
  g.textAlign='right';
  g.fillText('distance (km)', mL+pw, mT+ph+18);

  g.strokeStyle='#3a4260'; g.lineWidth=1;
  g.strokeRect(mL+.5, mT+.5, pw-1, ph-1);

  // 端點標記
  g.font='bold 12px Consolas'; g.textBaseline='bottom'; g.fillStyle=L.color;
  g.textAlign='left';  g.fillText(L.id, mL+3, mT-2);
  g.textAlign='right'; g.fillText(L.id+'′', mL+pw-3, mT-2);

  // hover 十字線
  if(L.hover){
    const {px,py}=L.hover;
    g.strokeStyle='rgba(245,200,66,.75)'; g.lineWidth=1; g.setLineDash([4,3]);
    g.beginPath(); g.moveTo(px+.5,mT); g.lineTo(px+.5,mT+ph);
    g.moveTo(mL,py+.5); g.lineTo(mL+pw,py+.5); g.stroke();
    g.setLineDash([]);
  }
}

/* ── 圖例 ───────────────────────────────────────────────── */
function buildSectionLegend(){
  const el=$('secLegend'); if(!el) return;
  const sec=S.section;
  el.innerHTML='';
  const active=secActiveLines();
  if(!active.length) return;

  const comps=[...new Set([].concat(...active.map(L=>L.compsUsed)))].sort((a,b)=>a-b);
  const feats=[...new Set([].concat(...active.map(L=>L.featsUsed)))].sort((a,b)=>a-b);

  // composition 用到哪些 feature，方便對照
  const compOwners={};
  const prep = active[0].prep || [];
  prep.forEach(p=>{
    const scan = models=>{
      if(!Array.isArray(models)) return;
      models.forEach(m=>{
        (Array.isArray(m && m.compositions)?m.compositions:[]).forEach(cid=>{
          (compOwners[cid] = compOwners[cid] || new Set()).add(p.name);
        });
      });
    };
    scan(p.f['composition models']);
    if(Array.isArray(p.f.segments)) p.f.segments.forEach(s=>scan(s && s['composition models']));
  });

  const lbl=document.createElement('span');
  lbl.className='grp'; lbl.textContent='composition';
  el.appendChild(lbl);

  if(!comps.length){
    const none=document.createElement('span');
    none.style.cssText='font-size:11px;color:var(--text-dim)';
    none.textContent=t('sec.noComp');
    el.appendChild(none);
  }
  comps.forEach(cid=>{
    const item=document.createElement('div');
    item.className='item'+(sec.hiddenComps.has(cid)?' off':'');
    const owners=compOwners[cid] ? [...compOwners[cid]].join(', ') : '';
    item.title = owners ? `comp ${cid} ← ${owners}` : `comp ${cid}`;
    item.innerHTML=`<div class="sw" style="background:${compColor(cid)}"></div><span>comp ${cid}</span>`;
    item.onclick=()=>{
      if(sec.hiddenComps.has(cid)) sec.hiddenComps.delete(cid); else sec.hiddenComps.add(cid);
      repaintAllRasters(); drawSectionCanvas(); buildSectionLegend();
    };
    el.appendChild(item);
  });

  if(feats.length){
    const l2=document.createElement('span');
    l2.className='grp'; l2.style.marginLeft='10px'; l2.textContent='features';
    el.appendChild(l2);
    feats.forEach(fi=>{
      const p = prep.find(x=>x.fi===fi);
      const item=document.createElement('div');
      item.className='item';
      item.title=t('sec.greyTip');
      const c=hslRgb((fi*137.508)%360,.30,.26);
      item.innerHTML=`<div class="sw" style="background:rgb(${c.join(',')})"></div>`+
                     `<span style="color:${getColor(fi)}">${p?p.name:('F'+fi)}</span>`;
      item.onclick=()=>{
        if(S.hiddenFeatures.has(fi)) S.hiddenFeatures.delete(fi); else S.hiddenFeatures.add(fi);
        updateAll(); scheduleSectionCompute(0);
      };
      el.appendChild(item);
    });
  }
}

/* ── 地圖上的剖面線 ─────────────────────────────────────── */
function drawSectionLineOnMap(){
  if(!S.bbox) return;
  secLines().forEach(L=>{
    if(!L.on) return;
    const a=L.p1, b=L.p2 || L.preview;
    if(!a) return;
    const sa=worldToScreen(a.x,a.y);
    ctx.save();
    if(b){
      const sb=worldToScreen(b.x,b.y);
      ctx.strokeStyle=L.color;
      ctx.lineWidth=2;
      ctx.setLineDash(L.p2?[]:[7,5]);
      ctx.beginPath(); ctx.moveTo(sa.x,sa.y); ctx.lineTo(sb.x,sb.y); ctx.stroke();
      ctx.setLineDash([]);
      drawSecHandle(sb, L.id+'′', L.color);
    }
    drawSecHandle(sa, L.id, L.color);
    ctx.restore();
  });
}
function drawSecHandle(s, label, color){
  ctx.fillStyle=color;
  ctx.strokeStyle='#0a0c12'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(s.x-5, s.y-5, 10, 10); ctx.fill(); ctx.stroke();
  ctx.font='bold 12px Consolas'; ctx.fillStyle=color;
  ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.shadowColor='rgba(0,0,0,.8)'; ctx.shadowBlur=4;
  ctx.fillText(label, s.x+8, s.y-4);
  ctx.shadowBlur=0;
}
function hitSectionEndpoint(mx,my){
  const sec=S.section;
  if(sec.picking || !S.bbox) return null;
  for(const L of secLines()){
    if(!L.on) continue;
    for(const key of ['p2','p1']){
      const p=L[key]; if(!p) continue;
      const s=worldToScreen(p.x,p.y);
      if(Math.hypot(mx-s.x, my-s.y) <= 9) return { id:L.id, key };
    }
  }
  return null;
}

/* ── 等長 ───────────────────────────────────────────────── */
function applyEqualLength(){
  const sec=S.section;
  if(!sec.equalLen) return;
  const ref=sec.lines[sec.eqRef];
  const oth=sec.lines[sec.eqRef==='A'?'B':'A'];
  if(!ref.p1||!ref.p2||!oth.p1||!oth.p2) return;
  const target=worldDist(ref.p1, ref.p2);
  if(!(target>0)) return;
  // 球面座標時一次縮放不會剛好收斂，迭代幾次
  for(let it=0; it<4; it++){
    const cur=worldDist(oth.p1, oth.p2);
    if(!(cur>0)) return;
    const k=target/cur;
    if(Math.abs(k-1)<1e-9) break;
    oth.p2={ x: oth.p1.x+(oth.p2.x-oth.p1.x)*k, y: oth.p1.y+(oth.p2.y-oth.p1.y)*k };
  }
}

/* ── 剖面資訊列 ─────────────────────────────────────────── */
function updateSectionInfo(){
  const sec=S.section;
  secLines().forEach(L=>{
    const el=$('secInfo'+L.id); if(!el) return;
    if(!L.on){ el.textContent=t('sec.off'); return; }
    if(sec.picking && sec.pickId===L.id){
      el.textContent = (sec.picking===1 ? t('sec.pick1') : t('sec.pick2b')).replace(/\{id\}/g, L.id);
      return;
    }
    const a=L.p1, b=L.p2||L.preview;
    if(!a || !b){ el.textContent=t('sec.undef'); return; }
    let az=Math.atan2(b.x-a.x, b.y-a.y)/DEG; if(az<0) az+=360;
    const extra = (L.ms && L.p2) ? `  ·  ${L.nx}×${L.nz} ${L.ms}ms` : '';
    el.textContent = `${(worldDist(a,b)/1000).toFixed(1)} km · ${az.toFixed(1)}° · `+
                     `(${fm(a.x)}, ${fm(a.y)})→(${fm(b.x)}, ${fm(b.y)})${extra}`;
  });
  const eq=$('secEqNote');
  if(eq) eq.textContent = sec.equalLen ? t('sec.eqNote').replace('{o}', sec.eqRef==='A'?'B':'A').replace('{r}', sec.eqRef) : '';
}

/* ── 面板開關 / 控制項 ──────────────────────────────────── */
function openSectionPane(open){
  const sec=S.section;
  sec.open=open;
  $('sectionPane').classList.toggle('open', open);
  $('sectionBtn').classList.toggle('on', open);
  if(!open){
    sec.picking=0; sec.pickId=null;
    secLines().forEach(L=>{ L.preview=null; });
    $('secPickA').classList.remove('on');
    $('secPickB').classList.remove('on');
    resize();
    return;
  }
  resize();
  scheduleSectionCompute(0);
}
function startSectionPick(id){
  const sec=S.section;
  const L=sec.lines[id];
  if(!L.on){ $('secOn'+id).checked=true; setLineEnabled(id,true,false); }
  sec.picking=1; sec.pickId=id;
  L.p1=null; L.p2=null; L.preview=null;
  L.fiGrid=null; L.raster=null;
  $('secPickA').classList.toggle('on', id==='A');
  $('secPickB').classList.toggle('on', id==='B');
  setStatus('ok', t('st.pick1').replace(/\{id\}/g, id));
  updateSectionInfo(); draw(); drawSectionCanvas(); buildSectionLegend();
}
function setSectionLine(id, a, b){
  const sec=S.section;
  const L=sec.lines[id];
  L.p1={x:a.x,y:a.y}; L.p2={x:b.x,y:b.y}; L.preview=null;
  if(sec.picking && sec.pickId===id){ sec.picking=0; sec.pickId=null; }
  $('secPick'+id).classList.remove('on');
  if(!L.on){ $('secOn'+id).checked=true; setLineEnabled(id,true,false); }
  sec.eqRef=id; const selEq=$('secEqRef'); if(selEq) selEq.value=id;
  applyEqualLength();
  updateSectionInfo(); draw();
  scheduleSectionCompute(0);
}
function setLineEnabled(id, on, recompute=true){
  const sec=S.section, L=sec.lines[id];
  L.on=on;
  if(on && (!L.p1 || !L.p2) && S.bbox){
    const bb=S.bbox;
    if(id==='A'){ const cy=(bb.minY+bb.maxY)/2; L.p1={x:bb.minX,y:cy}; L.p2={x:bb.maxX,y:cy}; }
    else        { const cx=(bb.minX+bb.maxX)/2; L.p1={x:cx,y:bb.minY}; L.p2={x:cx,y:bb.maxY}; }
    applyEqualLength();
  }
  if(!on){
    L.fiGrid=null; L.compGrid=null; L.raster=null; L.prep=null;
    L.compsUsed=[]; L.featsUsed=[]; L.hover=null; L.plotPrev=null;
  }
  $('grp'+id).classList.toggle('off', !on);
  updateSectionInfo(); draw();
  if(recompute){ resizeSectionCanvas(); scheduleSectionCompute(0); }
}
function resetSectionForNewData(){
  const sec=S.section;
  sec.picking=0; sec.pickId=null; sec.hiddenComps=new Set();
  secLines().forEach(L=>{
    L.p1=null; L.p2=null; L.preview=null;
    L.fiGrid=null; L.compGrid=null; L.raster=null; L.prep=null;
    L.compsUsed=[]; L.featsUsed=[]; L.hover=null; L.ms=0; L.plotPrev=null;
  });
  $('secPickA').classList.remove('on');
  $('secPickB').classList.remove('on');

  const cs = S.editedData && S.editedData['cross section'];
  const hasCS = Array.isArray(cs) && cs.length>=2 && Array.isArray(cs[0]) && Array.isArray(cs[1]);
  $('secFileBtn').style.display = hasCS ? '' : 'none';
  const A=sec.lines.A, B=sec.lines.B;
  if(hasCS){
    A.p1={x:cs[0][0], y:cs[0][1]};
    A.p2={x:cs[1][0], y:cs[1][1]};
  } else if(S.bbox){
    const bb=S.bbox, cy=(bb.minY+bb.maxY)/2;
    A.p1={x:bb.minX, y:cy}; A.p2={x:bb.maxX, y:cy};
  }
  if(S.bbox){
    const bb=S.bbox, cx=(bb.minX+bb.maxX)/2;
    B.p1={x:cx, y:bb.minY}; B.p2={x:cx, y:bb.maxY};
  }
  applyEqualLength();

  const guess = guessMaxDepth();
  if(guess>0){ sec.maxDepth=guess; $('secDepth').value = Math.round(guess/1000); }
  updateSectionInfo();
}
function guessMaxDepth(){
  let mx=0;
  const scan = v=>{
    if(typeof v==='number'){ if(v>mx && v<3e6) mx=v; return; }
    if(Array.isArray(v)) v.forEach(scan);
  };
  const feats=(S.editedData && Array.isArray(S.editedData.features))?S.editedData.features:[];
  feats.forEach(f=>{
    ['composition models','temperature models'].forEach(k=>{
      if(Array.isArray(f[k])) f[k].forEach(m=>{ if(m) scan(m['max depth']); });
    });
    scan(f['max depth']);
    if(Array.isArray(f.segments)){
      let sum=0;
      f.segments.forEach(s=>{ if(s) sum+=num(s.length,0); });
      if(sum>mx) mx=sum*0.75;
    }
  });
  if(!(mx>0)) return 0;
  return Math.ceil(mx*1.15/25000)*25000;
}

function initSectionUI(){
  const sec=S.section;
  $('sectionBtn').onclick  = ()=>openSectionPane(!sec.open);
  $('secCloseBtn').onclick = ()=>openSectionPane(false);

  ['A','B'].forEach(id=>{
    $('secOn'+id).onchange = function(){ setLineEnabled(id, this.checked); };
    $('secPick'+id).onclick = ()=>{
      if(sec.picking && sec.pickId===id){
        sec.picking=0; sec.pickId=null;
        $('secPick'+id).classList.remove('on');
        updateSectionInfo(); draw();
      } else startSectionPick(id);
    };
    $('secH'+id).onclick = ()=>{ if(!S.bbox) return; const b=S.bbox, cy=(b.minY+b.maxY)/2;
                                 setSectionLine(id, {x:b.minX,y:cy}, {x:b.maxX,y:cy}); };
    $('secV'+id).onclick = ()=>{ if(!S.bbox) return; const b=S.bbox, cx=(b.minX+b.maxX)/2;
                                 setSectionLine(id, {x:cx,y:b.minY}, {x:cx,y:b.maxY}); };
    $('secSwap'+id).onclick = ()=>{
      const L=sec.lines[id];
      if(L.p1&&L.p2){ const t=L.p1; L.p1=L.p2; L.p2=t; updateSectionInfo(); draw(); scheduleSectionCompute(0); }
    };
  });

  $('secEqual').onchange = function(){
    sec.equalLen=this.checked;
    applyEqualLength();
    updateSectionInfo(); draw(); scheduleSectionCompute(0);
  };
  $('secEqRef').onchange = function(){
    sec.eqRef=this.value;
    applyEqualLength();
    updateSectionInfo(); draw(); scheduleSectionCompute(0);
  };
  $('secFileBtn').onclick = ()=>{
    const cs=S.editedData && S.editedData['cross section'];
    if(Array.isArray(cs) && cs.length>=2) setSectionLine('A', {x:cs[0][0],y:cs[0][1]}, {x:cs[1][0],y:cs[1][1]});
  };
  $('secDepth').onchange = function(){
    const v=parseFloat(this.value);
    if(!(v>0)){ this.value=Math.round(sec.maxDepth/1000); return; }
    sec.maxDepth=v*1000; scheduleSectionCompute(0);
  };
  $('secRes').onchange = function(){ sec.res=parseInt(this.value,10)||480; scheduleSectionCompute(0); };
  $('secPngBtn').onclick = ()=>{
    const c=$('secCanvas');
    const out=document.createElement('canvas');
    out.width=c.width; out.height=c.height;
    const g=out.getContext('2d');
    g.fillStyle='#0f1117'; g.fillRect(0,0,out.width,out.height);
    g.drawImage(c,0,0);
    const a=document.createElement('a');
    a.download='gwb_cross_section.png';
    a.href=out.toDataURL('image/png');
    a.click();
  };

  // 拖曳分隔線調整高度
  let dragY=null, startH=0;
  $('secDivider').addEventListener('mousedown', e=>{
    dragY=e.clientY; startH=$('sectionPane').offsetHeight;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(dragY==null) return;
    const wrapH=document.querySelector('.canvas-wrap').clientHeight;
    const h=Math.max(160, Math.min(wrapH-120, startH-(e.clientY-dragY)));
    $('sectionPane').style.height=h+'px';
    resize();
  });
  window.addEventListener('mouseup', ()=>{
    if(dragY!=null){ dragY=null; scheduleSectionCompute(150); }
  });

  // 剖面畫布 hover
  const sc=$('secCanvas'), tip=$('secTip');
  sc.addEventListener('mousemove', e=>{
    const r=sc.getBoundingClientRect();
    const px=e.clientX-r.left, py=e.clientY-r.top;
    let target=null;
    for(const L of secActiveLines()){
      const pl=L.plot;
      if(pl && L.fiGrid && px>=pl.x && px<=pl.x+pl.w && py>=pl.y && py<=pl.y+pl.h){ target=L; break; }
    }
    let changed=false;
    secLines().forEach(L=>{ if(L.hover && L!==target){ L.hover=null; changed=true; } });
    if(!target){
      tip.style.display='none';
      if(changed) drawSectionCanvas();
      return;
    }
    target.hover={px,py};
    const pl=target.plot;
    const t=(px-pl.x)/pl.w, depth=((py-pl.y)/pl.h)*S.section.maxDepth;
    const hit=sectionProbe(target, t, depth);
    let txt = `【${target.id}–${target.id}′】${t('tip.dist')} ${(t*target.total/1000).toFixed(1)} km   ${t('tip.depth')} ${(depth/1000).toFixed(1)} km\n`;
    if(!hit){
      txt += t('tip.noFeat');
    } else {
      txt += `feature : ${hit.p.name}  [${hit.p.f.model||'?'}]\n`;
      if(hit.comp){
        const list=hit.comp.comps.map((cid,i)=>{
          const fr=hit.comp.fracs[i];
          return `${cid}${fr!==undefined?`(${fr})`:''}`;
        }).join(', ');
        txt += `comp    : ${hit.comp.comp}  ← [${list}]\n`;
        txt += `model   : ${hit.comp.modelName}`;
      } else {
        txt += 'comp    : '+t('tip.noComp');
      }
      if(hit.extra){
        txt += `\n${t('tip.fromTop')} : ${(hit.extra.dz/1000).toFixed(1)} km / ${t('tip.thick')} ${(hit.extra.th/1000).toFixed(1)} km`;
        txt += `\n${t('tip.alongSlab')} : ${(hit.extra.s/1000).toFixed(1)} km`;
      }
    }
    tip.textContent=txt;
    tip.style.display='block';
    const tw=tip.offsetWidth, th=tip.offsetHeight;
    tip.style.left = Math.max(4, Math.min(px+14, sc.width-tw-6)) + 'px';
    tip.style.top  = Math.max(4, Math.min(py+14, sc.height-th-6)) + 'px';
    drawSectionCanvas();
  });
  sc.addEventListener('mouseleave', ()=>{
    secLines().forEach(L=>{ L.hover=null; });
    $('secTip').style.display='none';
    drawSectionCanvas();
  });

  // 版面一變動就同步 canvas 的實際像素尺寸（避免滑鼠座標與畫面錯位）
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>resize());
    ro.observe(document.querySelector('.map-area'));
    ro.observe(document.querySelector('.sec-body'));
  }
  $('grpB').classList.toggle('off', !sec.lines.B.on);
  resize();
}
initSectionUI();

`

$('jsonInput').placeholder = t('ph.input') + PLACEHOLDER_EXAMPLE;
syncInputDecorations();

/* ═══════════ language switching ═══════════ */
function applyLang(){
  document.documentElement.lang = (LANG==='zh') ? 'zh-TW' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title = t(el.getAttribute('data-i18n-title')); });
  $('langBtn').textContent = (LANG==='zh') ? 'EN' : '中';
  $('jsonInput').placeholder = t('ph.input') + PLACEHOLDER_EXAMPLE;
  $('modeBtn').textContent = S.editMode ? t('btn.editing') : t('btn.edit');
  if(S.editedData){
    setStatus('ok', t('st.parsed').replace('{n}', S.features.length));
    buildWBOutput();
    buildLegend();
  } else {
    setStatus('', t('st.waiting'));
  }
  updateSectionInfo();
  drawSectionCanvas();
  buildSectionLegend();
}
$('langBtn').addEventListener('click', ()=>{
  LANG = (LANG==='zh') ? 'en' : 'zh';
  localStorage.setItem('gwbLang', LANG);
  applyLang();
});
applyLang();
</script>
