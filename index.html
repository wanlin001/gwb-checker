<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>GWB Checker v4.1</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #171b26;
  --panel2: #1e2333;
  --border: #2a3045;
  --accent: #4f8ef7;
  --green: #3ecf8e;
  --red: #f76f6f;
  --yellow: #f5c842;
  --text: #c9d1e0;
  --text-dim: #5a6480;
  --text-bright: #eef2ff;
  --mono: 'Cascadia Code', 'Consolas', 'Fira Mono', monospace;
  --ui: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
header h1 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: .5px;
}
.tag {
  font-size: 10px;
  background: var(--accent);
  color: #fff;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: .5px;
}
.main-layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── LEFT PANEL ── */
.left-panel {
  width: 380px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 12px;
  gap: 10px;
}
.input-section {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.input-shell {
  flex: 1;
  min-height: 0;
  display: flex;
  background: #0c0e16;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.line-gutter {
  width: 52px;
  flex-shrink: 0;
  padding: 10px 8px 10px 0;
  background: #0a0c12;
  border-right: 1px solid #1c2231;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 16px;
  text-align: right;
  overflow: hidden;
  user-select: none;
}
.line-gutter-content {
  transform: translateY(calc(-1 * var(--input-scroll-top, 0px)));
}
.line-number {
  height: 16px;
}
.line-number.error {
  color: var(--red);
  font-weight: 700;
  background: rgba(247, 111, 111, 0.12);
  border-radius: 4px;
}
.input-editor {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
}
.input-overlay {
  position: absolute;
  inset: 0;
  padding: 10px;
  overflow: hidden;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  color: transparent;
  pointer-events: none;
}
.input-overlay-content {
  transform: translateY(calc(-1 * var(--input-scroll-top, 0px)));
}
.input-overlay .error-chunk {
  display: inline-block;
  color: transparent;
  background: rgba(247, 111, 111, 0.18);
  outline: 1px solid rgba(247, 111, 111, 0.65);
  border-radius: 3px;
}
.panel-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
#jsonInput {
  flex: 1;
  min-height: 280px;
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 16px;
  padding: 10px;
  resize: none;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
#jsonInput:focus { box-shadow: inset 0 0 0 1px rgba(79, 142, 247, 0.28); }
#jsonInput.error-highlight {
  box-shadow: inset 0 0 0 1px rgba(247, 111, 111, 0.25);
}
.btn-primary {
  padding: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.btn-secondary {
  padding: 7px 10px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 12px;
  cursor: pointer;
  transition: background .15s;
  flex: 1;
}
.btn-secondary:hover { background: #2a3045; }
.btn-secondary:disabled { opacity: .35; cursor: default; }
.btn-row { display: flex; gap: 6px; }
#statusBox {
  font-family: var(--mono);
  font-size: 11px;
  padding: 8px 10px;
  border-radius: 5px;
  background: #0c0e16;
  border: 1px solid var(--border);
  color: var(--text-dim);
  min-height: 48px;
  white-space: pre-wrap;
  word-break: break-all;
}
#statusBox.ok  { color: var(--green); border-color: #1a4a35; }
#statusBox.err { color: var(--red);   border-color: #4a1a1a; }

/* legend */
#legend {
  display: none;
  background: #0c0e16;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  max-height: 200px;
  overflow-y: auto;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 0;
  cursor: pointer;
  font-size: 11.5px;
  border-radius: 3px;
  padding: 3px 4px;
  transition: background .1s;
}
.legend-row:hover { background: #1a2030; }
.legend-row.selected { background: #1e2840; }
.legend-row.hidden { opacity: .35; }
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* selection info */
#selInfo {
  font-family: var(--mono);
  font-size: 11px;
  padding: 8px 10px;
  border-radius: 5px;
  background: #0c0e16;
  border: 1px solid var(--border);
  color: var(--text-dim);
  min-height: 40px;
  display: none;
}
#selInfo.active {
  display: block;
  color: var(--yellow);
  border-color: #4a3d10;
}

/* ── CANVAS ── */
.canvas-wrap {
  flex: 1;
  background: #0a0c12;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.map-area {
  flex: 1;
  position: relative;
  min-height: 0;
  overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
canvas.dragging { cursor: grabbing; }
canvas.over-point { cursor: grab; }

.canvas-btn {
  position: absolute;
  padding: 6px 12px;
  background: rgba(30,35,51,.9);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 5px;
  font-size: 11px;
  cursor: pointer;
  transition: background .15s;
}
.canvas-btn:hover { background: #2a3045; }
#resetViewBtn { bottom: 16px; right: 16px; }
#modeBtn {
  bottom: 16px;
  left: 16px;
  display: none;
  padding: 6px 14px;
  font-weight: 700;
}
#modeBtn.edit-mode {
  background: rgba(79,142,247,.2);
  border-color: var(--accent);
  color: var(--accent);
}
#sectionBtn {
  bottom: 52px;
  left: 16px;
  display: none;
  padding: 6px 14px;
  font-weight: 700;
}
#sectionBtn.on {
  background: rgba(62,207,142,.18);
  border-color: var(--green);
  color: var(--green);
}

/* ── CROSS SECTION PANE ── */
.section-pane {
  height: 400px;
  flex-shrink: 0;
  background: var(--panel);
  display: none;
  flex-direction: column;
  min-height: 0;
}
.section-pane.open { display: flex; }
.sec-divider {
  height: 7px;
  flex-shrink: 0;
  cursor: ns-resize;
  background: #141824;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.sec-divider:hover { background: var(--accent); }
.sec-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.sec-title { font-weight: 700; color: var(--text-bright); font-size: 12px; white-space: nowrap; }
.sec-info { color: var(--text-dim); font-family: var(--mono); font-size: 10.5px; white-space: nowrap; }
.sec-toolbar label { display: flex; align-items: center; gap: 4px; color: var(--text-dim); white-space: nowrap; }
.sec-toolbar input[type=number] {
  width: 64px; background: #0c0e16; border: 1px solid var(--border);
  color: var(--text); border-radius: 4px; padding: 3px 5px;
  font-family: var(--mono); font-size: 11px;
}
.sec-toolbar select {
  background: #0c0e16; border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 3px 4px; font-size: 11px;
}
.sec-spacer { flex: 1; }
.sec-toolbar2 { background: rgba(0,0,0,.18); }
.sec-line-grp {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 6px;
  border: 1px solid var(--border); border-radius: 5px;
  background: #0c0e16;
  min-width: 0;
}
.sec-line-grp.off { opacity: .45; }
.sec-chk { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); }
.sec-chk input { accent-color: var(--accent); cursor: pointer; }
.mini-btn.ico { padding: 2px 6px; font-size: 12px; line-height: 1.35; }
.sec-line-grp .sec-info { overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.mini-btn {
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 3px 9px; font-size: 11px; cursor: pointer;
  transition: background .15s; white-space: nowrap;
}
.mini-btn:hover { background: #2a3045; }
.mini-btn.on { background: rgba(79,142,247,.2); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.sec-body { flex: 1; min-height: 0; position: relative; background: #0a0c12; }
#secCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.sec-tip {
  position: absolute; pointer-events: none; display: none; z-index: 5;
  background: rgba(12,14,22,.95); border: 1px solid var(--border);
  border-radius: 5px; padding: 5px 8px;
  font-family: var(--mono); font-size: 10.5px; color: var(--text-bright);
  white-space: pre; line-height: 1.5;
}
.sec-legend {
  flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 5px 14px;
  padding: 6px 10px; border-top: 1px solid var(--border);
  max-height: 78px; overflow-y: auto;
}
.sec-legend .item { display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; }
.sec-legend .item.off { opacity: .32; }
.sec-legend .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,.2); flex-shrink: 0; }
.sec-legend .grp { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; align-self: center; }

/* ── RIGHT PANEL ── */
.right-panel {
  width: 340px;
  flex-shrink: 0;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px;
  gap: 8px;
}
.right-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#copyBtn {
  padding: 5px 12px;
  background: var(--green);
  color: #0a1a12;
  border: none;
  border-radius: 5px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
#copyBtn:hover { opacity: .85; }
#wbOutput {
  flex: 1;
  background: #0c0e16;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.6;
  overflow-y: auto;
  overflow-x: auto;
  white-space: pre;
  word-break: normal;
  tab-size: 2;
}
/* Syntax color tokens */
.tok-key    { color: #7eb7f5; }
.tok-str    { color: #ce9178; }
.tok-num    { color: #b5cea8; }
.tok-punct  { color: var(--text-dim); }
.tok-feat   { color: #c792ea; }

/* per-feature coord highlight classes injected dynamically */
/* .fc-N { color: <feature color> } */
/* .fc-N.sel { filter: brightness(1.5); font-weight: 700; } */
/* .fc-N.sel-pt { background: rgba(...); border-radius:2px; } */

/* feature block in right panel: scroll-to + highlight on select */
.feat-block {
  display: inline-block;
  width: calc(100% + 8px);
  vertical-align: top;
  border-radius: 6px;
  margin: 2px -4px;
  padding: 2px 4px;
  border: 1px solid transparent;
  transition: background .18s, border-color .18s, box-shadow .18s;
}
.feat-block.active-feat {
  background: rgba(79, 142, 247, 0.12);
  border-color: rgba(79, 142, 247, 0.55);
  box-shadow: inset 3px 0 0 var(--accent);
}
.feat-block.flash-feat {
  animation: featFlash 1.1s ease;
}
@keyframes featFlash {
  0%   { background: rgba(245, 200, 66, 0.28); border-color: var(--yellow); }
  100% { background: rgba(79, 142, 247, 0.12); border-color: rgba(79, 142, 247, 0.55); }
}
</style>
<script data-goatcounter="https://GOATCOUNTER_CODE.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header>
  <h1><span data-i18n="app.title">⬡ GWB 檢查器</span> <span style="color:var(--text-dim)">v4.1</span></h1>
  <span class="tag" data-i18n="app.tag">點位編輯 + 剖面版</span>
  <button id="langBtn" class="canvas-btn" style="position:static;margin-left:auto">EN</button>
</header>

<div class="main-layout">

  <!-- LEFT -->
  <div class="left-panel">
    <div class="input-section">
      <div class="panel-label" data-i18n="lbl.paste">貼上 .wb 內容</div>
      <div class="input-shell">
        <div class="line-gutter" id="lineGutter"><div class="line-gutter-content" id="lineGutterContent"></div></div>
        <div class="input-editor">
          <div class="input-overlay" id="inputOverlay"><div class="input-overlay-content" id="inputOverlayContent"></div></div>
          <textarea id="jsonInput" placeholder='直接貼上 cat 輸出也行...'></textarea>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="drawBtn" data-i18n="btn.draw">✦ 解析並繪製</button>
    <div id="statusBox" data-i18n="st.waiting">等待輸入 GWB / .wb 資料…</div>

    <div class="btn-row">
      <button class="btn-secondary" id="undoBtn" disabled data-i18n="btn.undo">↩ 上一步</button>
      <button class="btn-secondary" id="resetEditBtn" disabled data-i18n="btn.resetEdit">⊘ 重置所有編輯</button>
    </div>

    <div>
      <div class="panel-label" data-i18n="lbl.layers">圖層</div>
      <div id="legend"></div>
    </div>

    <div id="selInfo"></div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div class="map-area">
      <canvas id="mainCanvas"></canvas>
      <button class="canvas-btn" id="resetViewBtn" data-i18n="btn.resetView">重置視角</button>
      <button class="canvas-btn" id="modeBtn" data-i18n="btn.edit">✎ 編輯模式</button>
      <button class="canvas-btn" id="sectionBtn" data-i18n="btn.section">◫ 剖面</button>
    </div>

    <div class="section-pane" id="sectionPane">
      <div class="sec-divider" id="secDivider" data-i18n-title="tip.drag" title="拖曳調整高度"></div>
      <div class="sec-toolbar">
        <span class="sec-title" data-i18n="sec.title">◫ 剖面</span>

        <div class="sec-line-grp" id="grpA">
          <label class="sec-chk"><input type="checkbox" id="secOnA" checked><b style="color:#f5c842">A–A′</b></label>
          <button class="mini-btn ico" id="secPickA" data-i18n-title="tip.pickA" title="在地圖上點兩下畫 A–A′">✎</button>
          <button class="mini-btn ico" id="secHA"    data-i18n-title="tip.hmid" title="設為模型水平中線">↔</button>
          <button class="mini-btn ico" id="secVA"    data-i18n-title="tip.vmid" title="設為模型垂直中線">↕</button>
          <button class="mini-btn ico" id="secSwapA" data-i18n-title="tip.swapA" title="反轉 A / A′">⇄</button>
          <span class="sec-info" id="secInfoA" data-i18n="sec.undef">尚未定義剖面線</span>
        </div>

        <div class="sec-line-grp off" id="grpB">
          <label class="sec-chk"><input type="checkbox" id="secOnB"><b style="color:#2ee6d6">B–B′</b></label>
          <button class="mini-btn ico" id="secPickB" data-i18n-title="tip.pickB" title="在地圖上點兩下畫 B–B′">✎</button>
          <button class="mini-btn ico" id="secHB"    data-i18n-title="tip.hmid" title="設為模型水平中線">↔</button>
          <button class="mini-btn ico" id="secVB"    data-i18n-title="tip.vmid" title="設為模型垂直中線">↕</button>
          <button class="mini-btn ico" id="secSwapB" data-i18n-title="tip.swapB" title="反轉 B / B′">⇄</button>
          <span class="sec-info" id="secInfoB" data-i18n="sec.off">（未啟用）</span>
        </div>
      </div>

      <div class="sec-toolbar sec-toolbar2">
        <label class="sec-chk"><input type="checkbox" id="secEqual"> <span data-i18n="sec.equal">兩剖面等長</span></label>
        <label><span data-i18n="sec.ref">基準</span>
          <select id="secEqRef"><option value="A">A</option><option value="B">B</option></select>
        </label>
        <span class="sec-info" id="secEqNote"></span>
        <button class="mini-btn" id="secFileBtn" style="display:none" data-i18n="sec.fileCS">⌸ 用檔案的 cross section → A</button>
        <span class="sec-spacer"></span>
        <label><span data-i18n="sec.depth">深度</span> <input type="number" id="secDepth" value="400" step="25" min="1"> km</label>
        <label><span data-i18n="sec.res">解析度</span>
          <select id="secRes">
            <option value="240" data-i18n="res.low">低</option>
            <option value="480" selected data-i18n="res.mid">中</option>
            <option value="820" data-i18n="res.high">高</option>
          </select>
        </label>
        <button class="mini-btn" id="secPngBtn">⇩ PNG</button>
        <button class="mini-btn" id="secCloseBtn">✕</button>
      </div>
      <div class="sec-body">
        <canvas id="secCanvas"></canvas>
        <div class="sec-tip" id="secTip"></div>
      </div>
      <div class="sec-legend" id="secLegend"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">
    <div class="right-toolbar">
      <div class="panel-label" style="margin:0" data-i18n="lbl.output">修改後的 WB 腳本</div>
      <button id="copyBtn" data-i18n="btn.copy">⎘ 複製</button>
    </div>
    <div id="wbOutput"><span style="color:var(--text-dim)" data-i18n="out.empty">解析資料後自動顯示…</span></div>
  </div>

</div>

<script>
/* ═══════════ i18n ═══════════ */
const I18N = {
 zh: {
  'app.title':'⬡ GWB 檢查器','app.tag':'點位編輯 + 剖面版',
  'lbl.paste':'貼上 .wb 內容','lbl.layers':'圖層','lbl.output':'修改後的 WB 腳本',
  'lbl.point':'點','lbl.points':'個點位','out.empty':'解析資料後自動顯示…',
  'btn.draw':'✦ 解析並繪製','btn.undo':'↩ 上一步','btn.resetEdit':'⊘ 重置所有編輯',
  'btn.resetView':'重置視角','btn.edit':'✎ 編輯模式','btn.editing':'✎ 編輯中…(點選點位可拖移)',
  'btn.section':'◫ 剖面','btn.copy':'⎘ 複製','btn.copied':'✓ 已複製！',
  'st.waiting':'等待輸入 GWB / .wb 資料…','st.needInput':'❌ 請先輸入資料內容。',
  'st.filtered':'(💡 已自動過濾 Shell 雜訊)',
  'st.parsed':'✅ 解析成功！共繪製 {n} 個物件。','st.resetDone':'⊘ 已重置所有編輯。',
  'st.pick1':'◫ 剖面 {id}：在地圖上點第 1 點（{id}）。',
  'st.pick2':'◫ 已定 {id} 點，再點一下決定 {id}′ 點。',
  'st.secSet':'◫ 剖面 {id}–{id}′ 已設定，正在計算 composition…',
  'err.noJson':'找不到有效的 JSON 結構 ({…})',
  'err.syntax':'❌ 語法錯誤：第 {l} 行，第 {c} 字元\n原因：{m}',

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function setStatus(type, msg){ const el = $('statusBox'); el.className = type; el.textContent = msg; }
function getColor(i, alpha=1){ const h = (i*137.508)%360; return alpha<1 ? `hsla(${h},75%,62%,${alpha})` : `hsl(${h},75%,62%)`; }
function brighten(hsl){ return hsl.replace('62%','85%'); }
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

let inputErrorState = null; // { line, column, position }

function clearInputErrorHighlight(){
  const input = $('jsonInput');
  input.classList.remove('error-highlight');
  inputErrorState = null;
  syncInputDecorations();
}
function highlightInputError(lineNumber, columnNumber, position){
  if(!Number.isFinite(lineNumber) || lineNumber < 1) return;
  const input = $('jsonInput');
  input.classList.add('error-highlight');
  inputErrorState = { line: lineNumber, column: columnNumber, position };
  syncInputDecorations();

  const style = getComputedStyle(input);
  const lineHeight = parseFloat(style.lineHeight) || 16;
  const targetTop = Math.max(0, (lineNumber - 1) * lineHeight - input.clientHeight / 2 + lineHeight);
  input.scrollTop = targetTop;
  syncInputDecorations();
}

function syncInputDecorations(){
  const input = $('jsonInput');
  const gutter = $('lineGutter');
  const gutterContent = $('lineGutterContent');
  const overlay = $('inputOverlay');
  const overlayContent = $('inputOverlayContent');
  const value = input.value || '';
  const lines = value.split('\n');
  const lineCount = Math.max(1, lines.length);

  gutter.style.setProperty('--input-scroll-top', `${input.scrollTop}px`);
  overlay.style.setProperty('--input-scroll-top', `${input.scrollTop}px`);

  let gutterHtml = '';
  for(let i = 1; i <= lineCount; i++){
    const cls = inputErrorState && inputErrorState.line === i ? 'line-number error' : 'line-number';
    gutterHtml += `<div class="${cls}">${i}</div>`;
  }
  gutterContent.innerHTML = gutterHtml;

  if(inputErrorState && Number.isFinite(inputErrorState.position)){
    const pos = Math.max(0, Math.min(inputErrorState.position, value.length));
    const start = Math.max(0, pos - 1);
    const end = Math.min(value.length, pos + 1);
    const before = escHtml(value.slice(0, start));
    const focus = escHtml(value.slice(start, end) || value.slice(pos, pos + 1) || ' ');
    const after = escHtml(value.slice(end));
    overlayContent.innerHTML = `${before}<span class="error-chunk">${focus}</span>${after}`;
  } else {
    overlayContent.innerHTML = escHtml(value);
  }

  if(value.endsWith('\n')) overlayContent.innerHTML += '\n';
}

function worldToScreen(wx, wy){
  const sy = S.bbox ? S.bbox.maxY - wy + S.bbox.minY : wy;
  return { x: wx*S.view.scale + S.view.ox, y: sy*S.view.scale + S.view.oy };
}
function screenToWorld(sx, sy){
  const wx = (sx - S.view.ox) / S.view.scale;
  const rawY = (sy - S.view.oy) / S.view.scale;
  const wy = S.bbox ? S.bbox.maxY - rawY + S.bbox.minY : rawY;
  return { x: wx, y: wy };
}

function fm(v) {
  if (typeof v !== 'number') return v;
  if (v === 0) return '0';
  if (Math.abs(v) >= 1000) return +(v / 1000).toFixed(4) + 'e3';
  return String(v); 
}

$('drawBtn').onclick = function(){
  const raw = $('jsonInput').value.trim();
  clearInputErrorHighlight();
  if(!raw){ setStatus('err',t('st.needInput')); return; }
  try {
    const match = raw.match(/\{[^]*\}/);
    if(!match) throw new Error(t('err.noJson'));
    const clean = match[0];
    let data;
    try { data = JSON.parse(clean); }
    catch(e){ throw new Error(diagJSON(e, clean)); }

    S.originalRaw  = clean;
    S.originalData = deepClone(data);
    S.editedData   = deepClone(data);
    S.history      = [];
    S.hoverPoint   = null;
    S.hoverFeature = null;
    S.selectedFeature = null;
    S.selectedPoint   = null;
    S.hiddenFeatures  = new Set();
    S.editMode        = false;

    buildFeatures();
    if(S.bbox){ resize(); autoFit(); }
    resetSectionForNewData();
    updateAll();

    const filtered = clean.length !== raw.length ? '\n'+t('st.filtered') : '';
    setStatus('ok', t('st.parsed').replace('{n}', S.features.length)+filtered);
  } catch(e){
    setStatus('err', e.message);
  }
};

function diagJSON(e, text){
  const m = e.message.match(/position\s+(\d+)/);
  if(m){
    const pos = +m[1];
    const lines = text.slice(0,pos).split('\n');
    const lineNumber = lines.length;
    const columnNumber = lines[lines.length-1].length;
    highlightInputError(lineNumber, columnNumber, pos);
    return t('err.syntax').replace('{l}',lineNumber).replace('{c}',columnNumber).replace('{m}',e.message);
  }
  return t('err.parse').replace('{m}', e.message);
}

function buildFeatures(){
  const raw = S.editedData.features || [];
  let allPts = [];
  S.features = [];
  
  raw.forEach((f, fi)=>{
    const coords = (f.coordinates||[]).map(p=>({x:p[0], y:p[1]}));
    coords.forEach(p=>allPts.push(p));
    let cx=0,cy=0;
    if(coords.length){
      coords.forEach(p=>{cx+=p.x;cy+=p.y;});
      cx/=coords.length; cy/=coords.length;
    }
    
    S.features.push({
      rIdx: S.features.length,
      isMain: true,
      fi: fi,
      name: f.name||`F${fi}`,
      coords,
      center: {x:cx, y:cy},
      isSlab: !!(f.model && f.model.includes('subducting')),
      color: getColor(fi),
      isMaxDepth: false
    });

    ['composition models', 'temperature models'].forEach(modKey => {
      if(Array.isArray(f[modKey])) {
        f[modKey].forEach((mod, mi) => {
          if(Array.isArray(mod['max depth'])) {
            mod['max depth'].forEach((mdItem, mdi) => {
              if(Array.isArray(mdItem) && mdItem.length === 2 && Array.isArray(mdItem[1])) {
                let mdCoords = mdItem[1];
                if(mdCoords.length > 0 && Array.isArray(mdCoords[0]) && mdCoords[0].length === 2) {
                  const subCoords = mdCoords.map(p=>({x:p[0], y:p[1]}));
                  subCoords.forEach(p=>allPts.push(p));
                  S.features.push({
                    rIdx: S.features.length,
                    isMain: false,
                    isMaxDepth: true,
                    fi: fi,
                    mi: mi,
                    mdi: mdi,
                    modKey: modKey,
                    name: `${f.name||`F${fi}`} - ${mod.model||'mod'} max depth`,
                    coords: subCoords,
                    center: {x:0, y:0},
                    isSlab: false,
                    color: getColor(fi)
                  });
                }
              }
            });
          }
        });
      }
    });
  });

  if(!allPts.length) { S.bbox = null; return; }
  const xs=allPts.map(p=>p.x), ys=allPts.map(p=>p.y);
  S.bbox={minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)};
}

function pushHistory(){
  S.history.push(deepClone(S.editedData));
  $('undoBtn').disabled = false;
  $('resetEditBtn').disabled = false;
}

$('undoBtn').onclick = function(){

  buildFeatures();

};

$('resetEditBtn').onclick = function(){

  $('undoBtn').disabled = true;
  $('resetEditBtn').disabled = true;

};

function buildLegend(){
  const el = $('legend');
  const mainFeatures = S.features.filter(f => f.isMain);
  el.style.display = mainFeatures.length ? 'block' : 'none';
  el.innerHTML = '';
  mainFeatures.forEach(f=>{
    const row = document.createElement('div');
    const isSel = (S.selectedFeature != null && S.features[S.selectedFeature].fi === f.fi);
    const isHid = S.hiddenFeatures.has(f.fi);
    row.className = `legend-row${isSel?' selected':''}${isHid?' hidden':''}`;
    row.innerHTML = `<div class="legend-dot" style="background:${isHid?'#444':f.color}"></div><span>${f.name}</span>`;
    row.addEventListener('click', e=>{
      if(e.shiftKey){
        if(S.hiddenFeatures.has(f.fi)) S.hiddenFeatures.delete(f.fi);
        else S.hiddenFeatures.add(f.fi);
      } else {
        S.selectedFeature = isSel ? null : f.rIdx;
        S.selectedPoint = null;
        S.pendingScrollFi = isSel ? null : f.fi;
      }
      updateAll();
    });
    el.appendChild(row);
  });
}

function scrollFeatureIntoView(fi, {flash=true} = {}){
  const box = $('wbOutput');
  const el = document.getElementById('feat-block-' + fi);
  if(!box || !el) return;
  const boxRect = box.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  const pad = 12;
  const above = elRect.top < boxRect.top + pad;
  const below = elRect.bottom > boxRect.bottom - pad;
  if(above || below){
    const delta = elRect.top - boxRect.top - box.clientHeight * 0.18;
    box.scrollTop += delta;
  }
  if(flash){
    el.classList.remove('flash-feat');
    // restart CSS animation
    void el.offsetWidth;
    el.classList.add('flash-feat');
  }
}

function updateSelInfo(){

function buildWBOutput(){
  const data = S.editedData;
  const box = $('wbOutput');
  if(!data){ box.innerHTML='<span style="color:var(--text-dim)">'+t('out.empty')+'</span>'; return; }

  const prevScroll = box.scrollTop;
  const doScrollFi = S.pendingScrollFi;

  let styles = '';
  const mainFeatures = S.features.filter(f => f.isMain);
  mainFeatures.forEach(f=>{
    const h = (f.fi*137.508)%360;
    styles += `.fc-${f.fi}{color:hsl(${h},80%,68%);transition:all .15s;}`; 
    styles += `.fc-${f.fi}.sel{color:hsl(${h},95%,82%);font-weight:700;}`;
    styles += `.fc-${f.fi}.sel-pt{background:hsla(${h},80%,50%,.18);border-radius:2px;padding:0 1px;}`;
    styles += `.fc-${f.fi}.dim{color:hsl(${h},40%,38%);}`;
    styles += `.fc-${f.fi}.hov{background:hsla(${h},80%,50%,.25);border-radius:2px;}`;
  });
  let styleEl = document.getElementById('dyn-styles');
  if(!styleEl){ styleEl=document.createElement('style'); styleEl.id='dyn-styles'; document.head.appendChild(styleEl); }
  styleEl.textContent = styles;

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const activeFi = (S.selectedFeature!=null && S.features[S.selectedFeature])
    ? S.features[S.selectedFeature].fi : -1;
  
  function rec(node, ind, path) {
    if (Array.isArray(node)) {
      if (node.length===0) return '<span class="tok-punct">[]</span>';
      
      let allPrim = node.every(x => typeof x !== 'object');
      if (allPrim) {
        let rIdxMatch = -1, ciMatch = -1;
        let isClickablePt = false;
        
        if (path[0] === 'features' && typeof path[1] === 'number') {
           let fi = path[1];
           if (path[2] === 'coordinates' && typeof path[3] === 'number') {
              isClickablePt = true;
              rIdxMatch = S.features.findIndex(f => f.isMain && f.fi === fi);
              ciMatch = path[3];
           }
           else if (
              path.length >= 8 &&
              ['composition models', 'temperature models'].includes(path[2]) &&
              path[4] === 'max depth' &&
              path[6] === 1 &&
              typeof path[7] === 'number'
           ) {
              isClickablePt = true;
              rIdxMatch = S.features.findIndex(f => f.isMaxDepth && f.fi === fi && f.mi === path[3] && f.mdi === path[5] && f.modKey === path[2]);
              ciMatch = path[7];
           }
        }
        
        let inner = node.map((x, i) => {
           let sVal = (typeof x === 'number') ? fm(x) : (typeof x === 'string' ? `"${x}"` : String(x));
           let fi = path[1] !== undefined ? path[1] : -1;
           
           if (isClickablePt && rIdxMatch >= 0) {
              let isSelPt = S.selectedPoint && S.selectedPoint.rIdx === rIdxMatch && S.selectedPoint.ci === ciMatch;
              let isHovPt = S.hoverPoint && S.hoverPoint.rIdx === rIdxMatch && S.hoverPoint.ci === ciMatch;
              
              let cls = `fc-${fi}`;
              if (isSelPt) cls += ' sel sel-pt';
              else if (S.hiddenFeatures.has(fi)) cls += ' dim';
              else if (S.selectedFeature === rIdxMatch || (S.selectedFeature!=null && S.features[S.selectedFeature].fi===fi)) cls += ' sel';
              if (isHovPt) cls += ' hov';
              
              return `<span class="${cls}" data-ridx="${rIdxMatch}" data-ci="${ciMatch}" data-hoverpt="1" style="cursor:pointer; display:inline-block;">${esc(sVal)}</span>`;
           } else if (typeof x === 'number') {
              let hc = (fi >= 0) ? ` data-fi="${fi}" data-hoverfeat="1" style="cursor:pointer;"` : '';
              let sCls = 'tok-num'; if(fi>=0 && S.hoverFeature != null && S.features[S.hoverFeature] && S.features[S.hoverFeature].fi===fi) sCls+=' hov';
              return `<span class="${sCls}"${hc}>${esc(sVal)}</span>`;
           } else if (typeof x === 'string') {
              return `<span class="tok-str">${esc(sVal)}</span>`;
           } else {
              return `<span class="tok-punct">${esc(sVal)}</span>`;
           }
        }).join('<span class="tok-punct">, </span>');
        
        return '<span class="tok-punct">[</span>' + inner + '<span class="tok-punct">]</span>';
      }
      
      let res = '<span class="tok-punct">[\n</span>';
      for (let i=0; i<node.length; i++) {
        res += ind + '  ' + rec(node[i], ind + '  ', [...path, i]) + (i<node.length-1 ? '<span class="tok-punct">,</span>' : '') + '\n';
      }
      res += ind + '<span class="tok-punct">]</span>';
      return res;
    } else if (node !== null && typeof node === 'object') {
      let keys = Object.keys(node);
      if (keys.length===0) return '<span class="tok-punct">{}</span>';
      let res = '<span class="tok-punct">{\n</span>';
      for (let i=0; i<keys.length; i++) {
        let k = keys[i];
        let fi = path[1] !== undefined ? path[1] : -1;
        let hc = (fi>=0) ? ` data-fi="${fi}" data-hoverfeat="1" style="cursor:pointer;"` : '';
        let sCls = 'tok-key'; if(fi>=0 && S.hoverFeature != null && S.features[S.hoverFeature] && S.features[S.hoverFeature].fi===fi) sCls+=' hov';
        let pK = `<span class="${sCls}" ${hc}>"${esc(k)}"</span>`;
        res += ind + '  ' + pK + '<span class="tok-punct">: </span>' + rec(node[k], ind + '  ', [...path, k]) + (i<keys.length-1 ? '<span class="tok-punct">,</span>' : '') + '\n';
      }
      res += ind + '<span class="tok-punct">}</span>';
      // Wrap each features[i] object so legend/canvas select can scroll + highlight it
      if (path[0] === 'features' && typeof path[1] === 'number' && path.length === 2) {
        const fi = path[1];
        const active = (activeFi === fi) ? ' active-feat' : '';
        return `<div id="feat-block-${fi}" class="feat-block${active}" data-fi="${fi}">${res}</div>`;
      }
      return res;
    } else if (typeof node === 'number') {
      let fi = path[1] !== undefined ? path[1] : -1;
      let hp = fi>=0 ? ` data-fi="${fi}" data-hoverfeat="1" style="cursor:pointer;"` : '';
      let sCls = 'tok-num'; if(fi>=0 && S.hoverFeature != null && S.features[S.hoverFeature] && S.features[S.hoverFeature].fi===fi) sCls+=' hov';
      return `<span class="${sCls}"${hp}>${esc(fm(node))}</span>`;
    } else if (typeof node === 'string') {
      return `<span class="tok-str">"${esc(node)}"</span>`;
    } else {
      return `<span class="tok-punct">${esc(String(node))}</span>`;
    }
  }
  
  box.innerHTML = rec(data, '', []);

  if (doScrollFi != null) {
    S.pendingScrollFi = null;
    // next frame so layout is ready
    requestAnimationFrame(() => scrollFeatureIntoView(doScrollFi, {flash: true}));
  } else {
    box.scrollTop = prevScroll;
  }
}

$('wbOutput').onmouseover = (e) => {
  let t = e.target;
  if(t.dataset.hoverpt) {
    S.hoverPoint = { rIdx: parseInt(t.dataset.ridx), ci: parseInt(t.dataset.ci) };
    draw();
    buildWBOutput();
  } else if (t.dataset.hoverfeat) {
    let fi = parseInt(t.dataset.fi);
    S.hoverFeature = S.features.findIndex(f => f.isMain && f.fi === fi);
    draw();
    buildWBOutput();
  }
};
$('wbOutput').onmouseout = (e) => {
  let t = e.target;

$('wbOutput').onclick = (e) => {
  let t = e.target;
  if(t.dataset.hoverpt) {
    S.selectedPoint = { rIdx: parseInt(t.dataset.ridx), ci: parseInt(t.dataset.ci) };
    S.selectedFeature = parseInt(t.dataset.ridx);
    // already in right panel — highlight only, soft scroll
    const f = S.features[S.selectedFeature];
    S.pendingScrollFi = f ? f.fi : null;
    updateAll();
  } else if(t.dataset.hoverfeat) {
    let fi = parseInt(t.dataset.fi);
    S.selectedFeature = S.features.findIndex(f => f.isMain && f.fi === fi);
    S.selectedPoint = null;
    S.pendingScrollFi = fi;
    updateAll();
  }
};

$('copyBtn').onclick = function(){
  if(!S.editedData){ return; }
  
  function genPlainText(node, indStr) {
    if (Array.isArray(node)) {
      if (node.length === 0) return '[]';
      let allPrim = node.every(x => typeof x !== 'object');
      if (allPrim) return '[' + node.map(x => typeof x === 'number' ? fm(x) : (typeof x === 'string'?`"${x}"`:String(x))).join(', ') + ']';
      let res = '[\n';
      for (let i=0; i<node.length; i++){ res += indStr + '  ' + genPlainText(node[i], indStr + '  ') + (i<node.length-1?',':'') + '\n'; }
      return res + indStr + ']';
    } else if (node !== null && typeof node === 'object') {
      let keys = Object.keys(node);
      if (keys.length === 0) return '{}';
      let res = '{\n';
      for(let i=0; i<keys.length; i++){ res += indStr + '  "' + keys[i] + '": ' + genPlainText(node[keys[i]], indStr + '  ') + (i<keys.length-1?',':'') + '\n'; }
      return res + indStr + '}';
    } else if (typeof node === 'number') { return fm(node);
    } else if (typeof node === 'string') { return `"${node}"`;
    } else { return String(node); }
  }
  
  const text = genPlainText(S.editedData, '');
  navigator.clipboard.writeText(text).then(()=>{
    this.textContent = t('btn.copied');
    setTimeout(()=>{ this.textContent = t('btn.copy'); }, 1800);
  });
};

function draw(){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(!S.bbox) return;

  ctx.save();
  ctx.translate(S.view.ox, S.view.oy);
  ctx.scale(S.view.scale, S.view.scale);

  S.features.forEach(f=>{
    if(S.hiddenFeatures.has(f.fi)) return;
    const isSel = S.selectedFeature === f.rIdx;
    const isLayerSel = S.selectedFeature != null && S.features[S.selectedFeature].fi === f.fi;
    const isHovFeat = S.hoverFeature != null && S.features[S.hoverFeature].fi === f.fi;
    const isDim = S.selectedFeature != null && !isLayerSel && !isHovFeat;
    const alpha = isDim ? 0.25 : 1;

    ctx.beginPath();
    f.coords.forEach((p,i)=>{
      const ly = S.bbox.maxY - p.y + S.bbox.minY;
      i===0 ? ctx.moveTo(p.x, ly) : ctx.lineTo(p.x, ly);
    });

    if(!f.isMaxDepth && !f.isSlab) {
      ctx.closePath();
      ctx.fillStyle = getColor(f.fi, isSel ? 0.18 : isHovFeat ? 0.12 : 0.07);
      ctx.fill();
    }

    const lw = (f.isSlab ? 3.5 : isSel ? 2.5 : 1.8) / S.view.scale;
    let strokeCol = isSel ? brighten(f.color) : f.color;
    if(alpha < 1) strokeCol = getColor(f.fi, alpha);
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = lw;
    
    if(f.isMaxDepth) ctx.setLineDash([10/S.view.scale, 8/S.view.scale]);
    else if(isDim) ctx.setLineDash([4/S.view.scale, 4/S.view.scale]);
    else ctx.setLineDash([]);
    
    ctx.stroke();
    ctx.setLineDash([]);

    f.coords.forEach((p,ci)=>{
      const ly = S.bbox.maxY - p.y + S.bbox.minY;
      const isSelPt = S.selectedPoint && S.selectedPoint.rIdx===f.rIdx && S.selectedPoint.ci===ci;
      const isHovPt = S.hoverPoint   && S.hoverPoint.rIdx===f.rIdx   && S.hoverPoint.ci===ci;
      const r = Math.abs((isSelPt ? 7 : isHovPt ? 5.5 : 3)/S.view.scale);

      ctx.beginPath();
      ctx.arc(p.x, ly, r, 0, Math.PI*2);
      if(isSelPt){
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = f.color;
        ctx.lineWidth = 2/S.view.scale;
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = isDim ? getColor(f.fi, .3) : (isHovPt ? '#fff' : strokeCol);
        ctx.fill();
      }
    });

    if(isSel || S.selectedFeature==null){
      if(!f.isMaxDepth || isSel) {
        let lx, ly;
        if (f.isMaxDepth) {
           lx = f.coords[0].x;
           ly = S.bbox.maxY - f.coords[0].y + S.bbox.minY;
        } else {
           lx = f.center.x;
           ly = S.bbox.maxY - f.center.y + S.bbox.minY;
        }
        ctx.font = `bold ${13/S.view.scale}px Segoe UI`;
        ctx.fillStyle = strokeCol;
        ctx.textAlign = f.isMaxDepth ? 'left' : 'center';
        ctx.shadowColor = 'rgba(0,0,0,.7)';
        ctx.shadowBlur = 4/S.view.scale;
        ctx.fillText(f.name, lx, ly - 10/S.view.scale);
        ctx.shadowBlur = 0;
      }
    }
  });

  ctx.restore();
  drawSelectedPointLabel();
  drawSectionLineOnMap();
  drawScaleBar(W,H);
}

function drawSelectedPointLabel(){
  if(!S.selectedPoint) return;
  const { rIdx, ci } = S.selectedPoint;
  const feature = S.features[rIdx];
  if(!feature || S.hiddenFeatures.has(feature.fi)) return;

  const point = feature.coords[ci];
  if(!point) return;

  const screen = worldToScreen(point.x, point.y);
  const labelLines = [`X: ${point.x.toFixed(4)}`, `Y: ${point.y.toFixed(4)}`];
  const paddingX = 8;
  const paddingY = 6;
  const lineHeight = 15;
  const labelX = screen.x + 12;
  const labelY = screen.y - 34;

  ctx.save();
  ctx.font = '12px Consolas';
  const textWidth = Math.max(...labelLines.map(line => ctx.measureText(line).width));
  const boxWidth = textWidth + paddingX * 2;
  const boxHeight = labelLines.length * lineHeight + paddingY * 2;

  ctx.fillStyle = 'rgba(12, 14, 22, 0.92)';
  ctx.strokeStyle = feature.color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(labelX, labelY, boxWidth, boxHeight, 6);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#eef2ff';
  labelLines.forEach((line, idx) => {
    ctx.fillText(line, labelX + paddingX, labelY + paddingY + 11 + idx * lineHeight);
  });
  ctx.restore();
}

function drawScaleBar(W,H){
  const target=120, wd=target/S.view.scale;
  const mag=Math.pow(10,Math.floor(Math.log10(wd)));
  const fd=wd/mag;
  const rd=mag*(fd<2?1:fd<5?2:5);
  const bw=rd*S.view.scale;
  const x=22, y=H-24;
  ctx.strokeStyle='rgba(255,255,255,.6)';
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.lineWidth=1.5;
  ctx.font='10px Consolas';
  ctx.beginPath();
  ctx.moveTo(x,y-8); ctx.lineTo(x,y); ctx.lineTo(x+bw,y); ctx.lineTo(x+bw,y-8);
  ctx.stroke();
  ctx.fillText(`${rd.toLocaleString()} units`,x,y-12);
}

function findNearestPoint(mx, my, threshold=18){
  let best=null, bestD=threshold;
  S.features.forEach(f=>{
    if(S.hiddenFeatures.has(f.fi)) return;
    f.coords.forEach((p,ci)=>{
      const s = worldToScreen(p.x,p.y);
      const d = Math.hypot(mx-s.x, my-s.y);
      if(d<bestD){ bestD=d; best={rIdx:f.rIdx, ci}; }
    });
  });
  return best;
}

canvas.addEventListener('mousedown', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  if(S.section.picking) return;          // 畫剖面線時不平移
  // 編輯模式下，模型點位優先於剖面端點
  const grab = (S.editMode && findNearestPoint(mx,my)) ? null : hitSectionEndpoint(mx,my);
  if(grab){
    S.section.dragEnd = grab;
    canvas.className = 'dragging';
    return;
  }

  if(S.editMode){
    const pt=findNearestPoint(mx,my);
    if(pt){
      pushHistory();
      S.draggingPoint=pt;
      S.selectedPoint=pt;
      S.selectedFeature=pt.rIdx;
      canvas.className='dragging';
      updateAll();
      return;
    }
  }
  S.isPanning=true;
  S.panStart={x:e.clientX,y:e.clientY};
  canvas.className='dragging';
});

canvas.addEventListener('mousemove', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  if(S.section.dragEnd){
    const {id,key}=S.section.dragEnd;
    const w=screenToWorld(mx,my);
    S.section.lines[id][key] = {x:w.x, y:w.y};
    S.section.eqRef=id; $('secEqRef').value=id;
    applyEqualLength();
    updateSectionInfo();
    draw();
    scheduleSectionCompute(220);
    return;
  }
  if(S.section.picking===2){
    const w=screenToWorld(mx,my);
    S.section.lines[S.section.pickId].preview = {x:w.x, y:w.y};
    updateSectionInfo();
    draw();
    return;
  }
  if(S.section.picking===1){
    canvas.className='';
    return;
  }
  if(!S.editMode && !S.isPanning && hitSectionEndpoint(mx,my)){
    canvas.className='over-point';
  } else if(!S.editMode && !S.isPanning && canvas.className==='over-point'){
    canvas.className='';
  }

  if(S.draggingPoint){
    const w=screenToWorld(mx,my);
    const {rIdx,ci}=S.draggingPoint;
    const fObj=S.features[rIdx];
    let coordArr;
    if(fObj.isMain) coordArr = S.editedData.features[fObj.fi].coordinates;
    else if(fObj.isMaxDepth) coordArr = S.editedData.features[fObj.fi][fObj.modKey][fObj.mi]['max depth'][fObj.mdi][1];
    
    coordArr[ci][0]=parseFloat(w.x.toFixed(4));
    coordArr[ci][1]=parseFloat(w.y.toFixed(4));
    buildFeatures();
    updateAll();
    return;
  }
  if(S.isPanning){
    S.view.ox += e.clientX-S.panStart.x;
    S.view.oy += e.clientY-S.panStart.y;
    S.panStart={x:e.clientX,y:e.clientY};
    draw();
    return;
  }
  if(S.editMode){
    const pt=findNearestPoint(mx,my);
    const changed = JSON.stringify(pt)!==JSON.stringify(S.hoverPoint);
    if(changed){
      S.hoverPoint=pt;
      canvas.className = pt ? 'over-point' : '';
      draw();
      buildWBOutput();
    }
  }
});

window.addEventListener('mouseup', ()=>{

canvas.addEventListener('wheel', e=>{
  e.preventDefault();

  S.view.ox = e.offsetX-(e.offsetX-S.view.ox)*f;
  S.view.oy = e.offsetY-(e.offsetY-S.view.oy)*f;

canvas.addEventListener('click', e=>{
  if(S.draggingPoint || S.section.dragEnd) return;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  if(S.section.picking){
    const id=S.section.pickId, L=S.section.lines[id];
    const w=screenToWorld(mx,my);
    if(S.section.picking===1){
      L.p1={x:w.x,y:w.y};
      L.p2=null;
      L.preview={x:w.x,y:w.y};
      S.section.picking=2;
      setStatus('ok', t('st.pick2').replace(/\{id\}/g, id));
      updateSectionInfo();
      draw();
    } else {
      L.preview=null;
      setStatus('ok', t('st.secSet').replace(/\{id\}/g, id));
      setSectionLine(id, L.p1, {x:w.x,y:w.y});
    }
    return;
  }

  const pt=findNearestPoint(mx,my);
  if(pt){
    const isSamePoint = S.selectedPoint && S.selectedPoint.rIdx===pt.rIdx && S.selectedPoint.ci===pt.ci;
    S.selectedPoint = isSamePoint ? null : pt;
    S.selectedFeature = isSamePoint ? null : pt.rIdx;
    if(!isSamePoint){
      const f = S.features[pt.rIdx];
      S.pendingScrollFi = f ? f.fi : null;
    } else {
      S.pendingScrollFi = null;
    }
    updateAll();
    return;
  }
  S.selectedPoint=null; S.selectedFeature=null; S.pendingScrollFi=null;
  updateAll();
});

function autoFit(){
  const bb=S.bbox;
  const W=Math.max(60,canvas.width), H=Math.max(60,canvas.height);
  const padW=Math.max(20, Math.min(120, W*0.15)), padH=Math.max(20, Math.min(120, H*0.15));
  let s=Math.min((W-padW)/(Math.abs(bb.maxX-bb.minX)||1),(H-padH)/(Math.abs(bb.maxY-bb.minY)||1));
  if(!isFinite(s) || s<=0) s=1;
  S.view.scale=s;
  S.view.ox=W/2-(bb.minX+bb.maxX)/2*s;
  S.view.oy=H/2-(bb.minY+bb.maxY)/2*s;
}
